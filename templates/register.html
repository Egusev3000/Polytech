{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация Великих Умов — Мосполитех</title>
    <link rel="stylesheet" href="{% static 'main_app/css/style.css' %}">
</head>
<body>
    {% include "includes/ticker.html" %}
    {% include "includes/navbar.html" %}

    <div style="max-width: 400px; margin: 60px auto; padding: 30px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;">
        <h2 style="text-align: center; margin-top: 0; text-transform: uppercase;">Регистрация Абитуриента</h2>
        <form method="post" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Придумайте логин" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
            <input type="email" name="email" placeholder="Ваша электронная почта" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
            <input type="password" name="password" placeholder="Придумайте пароль" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
            <button type="submit" style="background: #ffcc00; color: #000; padding: 12px; border: 1px solid #e6b800; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase;">Стать частью величия</button>
        </form>
        <p style="text-align: center; margin-top: 20px; font-size: 14px;">Уже зарегистрированы? <a href="/login/" style="color: #1d4ed8;">Войти</a></p>
    </div>

    {% include "includes/footer.html" %}
</body>
</html>
